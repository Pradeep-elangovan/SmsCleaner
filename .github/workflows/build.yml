name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$( { grep -E '^e: |error:|AAPT' build.log | head -25; grep -A5 'What went wrong' build.log | head -12; } | sed 's/\r//g; s/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' )
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: SmsCleaner-apk
          path: app/build/outputs/apk/debug/app-debug.apk
